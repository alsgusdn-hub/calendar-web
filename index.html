<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월간 달력</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calendar">
    <header class="calendar-header">
      <button type="button" id="prev" class="nav-btn" aria-label="이전 달">&lsaquo;</button>
      <h1 id="title" aria-live="polite"></h1>
      <button type="button" id="next" class="nav-btn" aria-label="다음 달">&rsaquo;</button>
    </header>
    <div class="grid weekdays" id="weekdays"></div>
    <div class="grid days" id="days"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
